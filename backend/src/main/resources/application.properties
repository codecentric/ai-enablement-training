# Kiezmarkt listing service — the contract puts every path under /v1
server.servlet.context-path=/v1
server.port=8080
spring.jackson.default-property-inclusion=always
# Spring Boot's Jackson2ObjectMapperBuilder disables this by default; every
# request schema in contracts/api.yaml is additionalProperties:false, so an
# unrecognized field (e.g. a create body carrying "status") must fail.
spring.jackson.deserialization.fail-on-unknown-properties=true
